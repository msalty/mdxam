<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172554">
  <meta name="description" content="Turn Markdown study guides into private, offline practice exams.">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: https:; connect-src 'self' https:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>MDXam · Markdown practice exams</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <header class="app-header">
    <!-- Kept hidden for compatibility while older cached shells update. -->
    <button class="hidden" id="sidebarToggle" type="button" aria-hidden="true" tabindex="-1"></button>
    <a class="brand" href="#exams" aria-label="MDXam home">
      <img src="./icons/icon-192.png" width="32" height="32" alt="">
      <span>MDXam</span>
    </a>
    <div class="header-status">
      <span class="status-pill" id="connectionStatus" role="status">Online</span>
      <button class="button button-small button-ghost hidden" id="installButton" type="button">Install</button>
    </div>
  </header>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <nav class="nav-list">
        <a class="nav-link" href="#exams" data-route="exams">
          <img src="./icons/exams-64.png" width="22" height="22" alt=""><span>Exams</span>
        </a>
        <a class="nav-link" href="#import" data-route="import">
          <img src="./icons/upload-file-64.png" width="22" height="22" alt=""><span>Add exam</span>
        </a>
      </nav>
      <a class="nav-link" href="#settings" data-route="settings">
        <img src="./icons/settings-64.png" width="22" height="22" alt=""><span>Settings</span>
      </a>
    </aside>
    <button class="hidden" id="sidebarScrim" type="button" aria-hidden="true" tabindex="-1"></button>
    <main class="content" id="content" tabindex="-1" aria-live="polite">
      <div class="loading-state">Loading MDXam…</div>
    </main>
  </div>

  <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>
  <dialog id="confirmDialog" class="dialog">
    <form method="dialog">
      <h2 id="confirmTitle">Confirm action</h2>
      <p id="confirmMessage"></p>
      <div class="dialog-actions">
        <button class="button button-ghost" value="cancel">Cancel</button>
        <button class="button button-danger" id="confirmAction" value="confirm">Confirm</button>
      </div>
    </form>
  </dialog>
  <dialog id="startExamDialog" class="dialog start-dialog">
    <form method="dialog" id="startExamForm">
      <h2>Start exam</h2>
      <p class="muted" id="startExamDescription"></p>
      <div class="field">
        <label for="questionCount">Questions in this attempt</label>
        <input id="questionCount" type="number" min="1" step="1" required>
        <span class="field-help">Questions will be selected randomly. The default is the complete exam.</span>
      </div>
      <div class="dialog-actions">
        <button class="button button-ghost" value="cancel">Cancel</button>
        <button class="button" value="start">Start exam</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="./main.js"></script>
</body>
</html>
